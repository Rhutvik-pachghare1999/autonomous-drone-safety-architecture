[tool.poetry]
name = "aisp-neurosymbolic"
version = "2.0.0"
description = "Hard real-time HOCBF safety filter for AI-driven drones — ASU MS research prototype"
authors = ["Rhutvik Prashant Pachghare <rpachgha@asu.edu>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/Rhutvik-pachghare1999/autonomous-drone-safety-architecture"
keywords = ["robotics", "control-barrier-functions", "real-time", "reinforcement-learning"]

[tool.poetry.dependencies]
python = "^3.12"

# Core numerical computing
numpy = "^1.26.0"
scipy = "^1.12.0"

# Symbolic Lie-derivative chain (experiments/exp_lie_derivatives.py)
casadi = "^3.6.0"

# Consensus IPC (services/consensus_node.py uses pyzmq)
pyzmq = "^25.1.0"

# C++ HOCBF binding build (src/control/hocbf.cpp)
pybind11 = "^2.11.0"

# Reinforcement Learning — optional, only sim/quadrotor_rl.py (needs Isaac Sim)
torch = {version = "^2.2.0", optional = true}
stable-baselines3 = {version = "^2.2.0", optional = true}

# Vision-Language-Action model — optional, only src/perception/vla_bridge.py
transformers = {version = "^4.38.0", optional = true}
pillow = {version = "^10.2.0", optional = true}

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.23.0"
hypothesis = "^6.98.0"
mypy = "^1.8.0"
ruff = "^0.2.0"
black = "^24.2.0"

[tool.poetry.extras]
rl = ["torch", "stable-baselines3"]
vla = ["transformers", "pillow"]
full = ["torch", "stable-baselines3", "transformers", "pillow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: integration tests",
    "adversarial: adversarial/hallucination stress tests",
]
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
